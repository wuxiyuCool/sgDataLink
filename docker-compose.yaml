# DataBridge Mock 版本 —— 一键拉起 3 个服务（不含任何数据库）
# 使用：docker compose up -d --build
# 前端 http://localhost:8000  管理后端 http://localhost:3001/api/v1  引擎 http://localhost:8080/health

name: databridge

services:
  databridge-admin:
    build:
      context: ./node-express-boilerplate
    image: databridge/admin:mock
    container_name: databridge-admin
    environment:
      NODE_ENV: production
      MEM_MOCK: "true" # 不连 MongoDB（内存模式下也不连任何库；DB_DRIVER=mysql 时该值仅表示跳过 mongoose）
      PORT: "3001"
      ENGINE_BASE_URL: http://databridge-engine:8080 # Node 下发启停指令的 Go 引擎地址
      ADMIN_REPORT_URL: http://databridge-admin:3001/api/v1/engine # 引擎回报进度的 Node 地址
      # 持久层驱动：memory = 纯内存 Mock（重启回种子）；mysql = 生产模式，落库 databridge_* 表
      # 生产部署：cp .env.example .env 填好密码后 up，compose 自动读取根目录 .env 完成替换
      DB_DRIVER: ${DB_DRIVER:-memory}
      # 演示种子（契约 4.1）：留空 = memory 注入 / mysql 不注入（空库起步，只放用户真实配置）
      # 需要临时灌演示数据时取消注释（或写进根 .env）；历史残留演示行用 `yarn db:cleanup` 清
      # SEED_DEMO: "true"
      MYSQL_HOST: ${MYSQL_HOST:-10.45.34.222}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      # 口令一律从根 .env / secret 注入，不要把明文写进仓库
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dataLink}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - databridge

  databridge-engine:
    build:
      context: ./databridge-engine
    image: databridge/engine:mock
    container_name: databridge-engine
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: release
      NODE_REPORT_URL: http://databridge-admin:3001/api/v1/engine
      MOCK_TICK_MS: "1000" # 模拟推进节奏，调小可加速演示
    ports:
      - "8080:8080"
    depends_on:
      databridge-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - databridge

  databridge-web:
    build:
      context: ./vue-vben-admin
    image: databridge/web:mock
    container_name: databridge-web
    ports:
      - "8000:80" # nginx 托管静态资源并反代 /api 与 /ds（数据服务运行时）-> databridge-admin
    depends_on:
      databridge-admin:
        condition: service_healthy
    networks:
      - databridge

networks:
  databridge:
    driver: bridge
