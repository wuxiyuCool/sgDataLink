# DataBridge 前端（vben-admin 构建产物）nginx 配置
# 由 Dockerfile 拷贝到 /etc/nginx/conf.d/default.conf

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    gzip            on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary       on;

    # DataBridge 管理后端（docker-compose 服务名），保留 /api 前缀：
    # 前端请求 /api/v1/... -> http://databridge-admin:3001/api/v1/...
    location /api/ {
        proxy_pass         http://databridge-admin:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 数据服务运行时总线（docs/API.md 1.9 GET /ds/{path}）：
    # 它不在 /api/v1 管理前缀内，Node 直接挂在顶层，所以这里要单独反代，
    # 否则「调试」面板生成的 window.location.origin + /ds/... 会落到 SPA 回退上返回 index.html。
    # X-Real-IP / X-Forwarded-For 必须透传：apiKey 之外的 IP 白名单判定读的就是这两个头。
    location /ds/ {
        proxy_pass         http://databridge-admin:3001/ds/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files  $uri =404;
    }

    # SPA history 模式回退，index.html 不缓存
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
