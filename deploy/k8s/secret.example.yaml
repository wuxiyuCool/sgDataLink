# 敏感配置 Secret 模板 —— 复制为真实文件后 kubectl apply，真实文件不要提交
# 推荐用命令行创建（避免明文进 yaml）：
#   kubectl -n databridge create secret generic databridge-db-secret \
#     --from-literal=MYSQL_PASSWORD='你的数据库口令' \
#     --from-literal=ENGINE_SHARED_SECRET="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
#
# ENGINE_SHARED_SECRET（契约 v1.12 引擎共享密钥）说明：
#   - admin 调用 engine /sql/query、/sql/exec 时带 X-Engine-Token 头；
#     engine 回报进度到 admin /engine/report 时也带同名头（双向同源）。
#   - 两侧必须同值：admin 读 .env/ConfigMap-Secret 的 ENGINE_SHARED_SECRET，
#     engine 只读同名环境变量（不读 config/*.yml）。
#   - engine 侧留空 = 无鉴权过渡态（启动打 WARN 并放行），生产禁止。
#   - 改值后需同时重启 admin 与 engine 两个 Deployment。
#
# HTTPS_PROXY（出站代理，仅 admin 需要）说明：
#   - 内网容器无法直连外网 LLM API（DeepSeek 等），必须经 squid 出口；
#     Node 18 全局 fetch 不读代理环境变量，故由 src/utils/proxyAgent.js 生效
#     （https 走 CONNECT 隧道 + Proxy-Authorization Basic，http 走绝对 URI）。
#   - 值形如 http://<user>:<pass>@10.45.34.223:3128；口令需已在 squid 侧加白。
#   - 配了它也要在 ConfigMap 设 NO_PROXY，避免集群内服务/内网库被代理走。
#   - 有直连出口的环境（本地开发）留空即直连，行为不变。
apiVersion: v1
kind: Secret
metadata:
  name: databridge-db-secret
  namespace: databridge
type: Opaque
stringData:
  MYSQL_PASSWORD: "CHANGE_ME"
  ENGINE_SHARED_SECRET: "CHANGE_ME_SAME_ON_ADMIN_AND_ENGINE"
  HTTPS_PROXY: "http://CHANGE_USER:CHANGE_PASS@10.45.34.223:3128"
