# 数据库口令 Secret 模板 —— 复制为真实文件后 kubectl apply，真实文件不要提交
# 生成方式（推荐，避免明文进 yaml）：
#   kubectl -n databridge create secret generic databridge-db-secret \
#     --from-literal=MYSQL_PASSWORD='你的口令'
apiVersion: v1
kind: Secret
metadata:
  name: databridge-db-secret
  namespace: databridge
type: Opaque
stringData:
  MYSQL_PASSWORD: "CHANGE_ME"
