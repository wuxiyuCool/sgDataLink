# Node 管理后端（Mock 内存模式，无数据库）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databridge-admin
  namespace: databridge
  labels:
    app: databridge-admin
spec:
  replicas: 1 # Mock 阶段内存存储多副本不共享，第二阶段接 PG 后可扩容
  selector:
    matchLabels:
      app: databridge-admin
  template:
    metadata:
      labels:
        app: databridge-admin
    spec:
      imagePullSecrets:
        - name: harbor-registry   # kubectl create secret docker-registry harbor-registry --docker-server=10.45.34.165:5000 ...
      containers:
        - name: admin
          image: databridge/admin:mock # 替换为你的镜像仓库地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: MEM_MOCK
              value: "true"
            - name: PORT
              value: "3001"
            - name: ENGINE_BASE_URL
              value: http://databridge-engine:8080
            - name: ADMIN_REPORT_URL
              value: http://databridge-admin:3001/api/v1/engine
            # 生产模式（MySQL 落库）：DB_DRIVER/MYSQL_* 来自 ConfigMap，口令来自 Secret
            # 演示模式删除下面 envFrom 即可（默认 memory，全 mock 数据）
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: databridge-db-secret
                  key: MYSQL_PASSWORD
          envFrom:
            - configMapRef:
                name: databridge-config
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: databridge-admin
  namespace: databridge
spec:
  selector:
    app: databridge-admin
  ports:
    - name: http
      port: 3001
      targetPort: http
  type: ClusterIP
