# 生产模式配置（DB_DRIVER=mysql）；演示模式无需本文件（compose 默认 memory）
apiVersion: v1
kind: ConfigMap
metadata:
  name: databridge-config
  namespace: databridge
data:
  DB_DRIVER: "mysql"
  MYSQL_HOST: "10.45.34.222" # ← 换成实际内网 MySQL 地址
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_DATABASE: "dataLink"
  MYSQL_CONNECTION_LIMIT: "10"
  # 登录 token 寿命（分钟）。没有 /auth/refresh 接口，exp 在登录瞬间钉死、不随操作滑动，
  # 默认 30 分钟表现为「用着用着突然退回登录页」，故按一个工作日放宽到 8 小时。
  JWT_ACCESS_EXPIRATION_MINUTES: "480"
