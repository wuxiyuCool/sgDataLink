# 生产模式配置（DB_DRIVER=mysql）；演示模式无需本文件（compose 默认 memory）
apiVersion: v1
kind: ConfigMap
metadata:
  name: databridge-config
  namespace: databridge
data:
  DB_DRIVER: "mysql"
  MYSQL_HOST: "10.45.34.222" # ← 换成实际内网 MySQL 地址
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_DATABASE: "dataLink"
  MYSQL_CONNECTION_LIMIT: "10"
  # 内网直连白名单：配了 HTTPS_PROXY 时，这些目标绕过代理（集群内服务、内网库、节点网段）
  # 逗号分隔主机后缀，由 src/utils/proxyAgent.js 解析
  NO_PROXY: "localhost,127.0.0.1,.svc,.cluster.local,databridge-engine,databridge-admin,10.45.34.222,10.45.34.223,10.45.34.165,10.45.34.167"
