namespace: databridge
resources:
  - namespace.yaml
  - configmap.yaml
  # 生产部署前：kubectl create secret generic databridge-db-secret -n databridge --from-literal=MYSQL_PASSWORD=xxx
  # （或 apply 自建副本的 secret.example.yaml，真实 secret 文件勿入库）
  - admin.yaml
  - engine.yaml
  - web.yaml
# build-push-harbor.sh 推送成功后自动改写 newTag；kubectl apply -k 时映射到 Harbor
images:
  - name: databridge/admin
    newName: 10.45.34.165:5000/databridge/admin
    newTag: v1.0.0
  - name: databridge/engine
    newName: 10.45.34.165:5000/databridge/engine
    newTag: v1.0.0
  - name: databridge/web
    newName: 10.45.34.165:5000/databridge/web
    newTag: v1.0.0
